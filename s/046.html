<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유월절 제정과 장자의 죽음 · 성경 이야기 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8;--paper:#fffdf8;--ink:#25211a;--muted:#6d6558;--line:#e4dccb;
  --accent:#b07d22;--accent-soft:#f3e6c8;--blue:#2d6ea6;--ok:#2e8554;--ok-soft:#dcefe3;--bad:#b9443a;--bad-soft:#f6dedb;--chip:#efe8d8;
  --shadow:0 10px 30px rgba(60,45,20,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12110f;--paper:#1c1a17;--ink:#eee7da;--muted:#a79f90;--line:#322e27;
  --accent:#e2b457;--accent-soft:#3a2f1b;--blue:#6fa9df;--ok:#5cc189;--ok-soft:#1d3327;--bad:#e27a70;--bad-soft:#3b2220;--chip:#28251f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12110f;--paper:#1c1a17;--ink:#eee7da;--muted:#a79f90;--line:#322e27;
  --accent:#e2b457;--accent-soft:#3a2f1b;--blue:#6fa9df;--ok:#5cc189;--ok-soft:#1d3327;--bad:#e27a70;--bad-soft:#3b2220;--chip:#28251f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Gowun Batang",serif;line-height:1.3;margin:0}
button{font:inherit;cursor:pointer}

/* hero */
.hero{padding:40px 0 22px}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tag{background:var(--chip);border-radius:999px;padding:3px 11px;font-weight:500}
.tag.gold{background:var(--accent-soft);color:var(--accent)}
.hero h1{font-size:clamp(34px,6vw,56px);margin:10px 0 6px;letter-spacing:-.5px}
.hero .lead{font-size:17px;color:var(--muted);max-width:760px;margin:0}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.nav a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px}
.nav a:hover{border-color:var(--accent);color:var(--accent)}

section{margin:34px 0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head .num{font-family:"Gowun Batang",serif;color:var(--accent);font-weight:700;font-size:15px}
.sec-head h2{font-size:26px}
.sec-head p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* simulation */
.sim{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px}
.stage-card{padding:10px}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/10}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.day-label{position:absolute;left:16px;top:12px;color:#fff;font-family:"Gowun Batang",serif;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.day-label .n{font-size:clamp(22px,3.4vw,34px);font-weight:700;display:block}
.day-label .s{font-size:13px;opacity:.85;font-family:"Noto Sans KR",sans-serif}
.decree{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#fff;font-family:"Gowun Batang",serif;font-weight:700;
  font-size:clamp(20px,3.6vw,38px);text-align:center;width:90%;text-shadow:0 0 24px rgba(255,230,160,.9),0 2px 8px rgba(0,0,0,.7);opacity:0;pointer-events:none}
.decree.show{animation:decree 3.6s ease forwards}
@keyframes decree{0%{opacity:0;transform:translate(-50%,-40%) scale(.96);letter-spacing:6px}18%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:1px}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}
.hint{position:absolute;right:12px;bottom:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.38);padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .5s;pointer-events:none}
.hint.show{opacity:1}

.controls{display:flex;align-items:center;gap:8px;padding:12px 4px 4px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07);color:#fff}
.btn.on{background:#1f2a48;color:#fff;border-color:#1f2a48}
.spacer{flex:1}
.days{display:grid;grid-template-columns:repeat(var(--n,8),1fr);gap:6px;padding:8px 4px 4px}
.dbtn{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:10px;padding:7px 2px;font-size:12px;line-height:1.25;text-align:center}
.dbtn b{display:block;font-size:15px;color:var(--ink);font-family:"Gowun Batang",serif}
.dbtn.done{background:var(--accent-soft)}
.dbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.dbtn.active b{color:#fff}

.panel{padding:22px;display:flex;flex-direction:column;gap:14px}
.panel .ref{font-size:13px;color:var(--accent);font-weight:700}
.panel h3{font-size:24px}
.panel .story{font-size:16px;margin:0}
.made{display:flex;gap:6px;flex-wrap:wrap}
.made span{background:var(--chip);border-radius:8px;padding:4px 10px;font-size:14px}
.good{font-family:"Gowun Batang",serif;color:var(--accent);font-weight:700;font-size:15px;border-left:3px solid var(--accent);padding-left:10px}
.think{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.think b{display:block;font-size:12px;color:var(--accent);letter-spacing:.5px;margin-bottom:2px}
details.tnote{border-top:1px dashed var(--line);padding-top:10px;font-size:14px;color:var(--muted)}
details.tnote summary{cursor:pointer;font-weight:700;color:var(--ink)}

/* structure */
.frame{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:stretch;padding:20px}
.frame .colh{font-weight:700;text-align:center;font-size:15px;color:var(--muted)}
.frame .colh em{display:block;font-style:normal;font-family:"Gowun Batang",serif;color:var(--ink);font-size:19px}
.fcell{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.fcell:hover{transform:translateY(-2px);border-color:var(--accent)}
.fcell .d{font-size:12px;color:var(--accent);font-weight:700}
.fcell .w{font-size:17px;font-weight:700}
.fcell .e{font-size:22px;float:right}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px}
.frame-foot{grid-column:1/-1;text-align:center;border-radius:12px;padding:12px;background:var(--accent-soft);font-family:"Gowun Batang",serif;font-size:17px;border:none;color:var(--ink)}
.frame-note{padding:0 20px 20px;margin:0;color:var(--muted);font-size:14px}

/* match game */
.game{padding:20px}
.game-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.score{font-weight:700;color:var(--accent)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px}
.item{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:center;transition:transform .15s}
.item .ic{font-size:20px}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-2px)}
.item.placed{background:var(--ok-soft);border-color:var(--ok);cursor:default;font-size:13px;padding:4px 8px}
.item.placed .ic{font-size:16px}
.slots{display:grid;grid-template-columns:repeat(var(--sn,7),1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;min-height:130px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;color:var(--ink)}
.slot .sh{font-family:"Gowun Batang",serif;font-weight:700;text-align:center;font-size:15px}
.slot.ready{border-color:var(--accent);background:var(--accent-soft)}
.slot.wrong{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.game-msg{margin-top:12px;min-height:26px;font-weight:500}

/* quiz */
.quiz{padding:20px;display:grid;gap:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
.q .qt{font-weight:700;margin-bottom:8px}
.q .qt span{color:var(--accent);margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrongp{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.exp{font-size:14px;color:var(--muted);margin-top:8px;display:none}
.exp.show{display:block}
.quiz-score{font-weight:700;color:var(--accent);font-size:17px}

/* share */
.tabs{display:flex;gap:6px;padding:16px 20px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 16px;font-weight:500}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qlist{padding:16px 20px 20px;margin:0;display:grid;gap:10px;list-style:none;counter-reset:q}
.qlist li{counter-increment:q;background:var(--bg);border-radius:12px;padding:12px 14px 12px 46px;position:relative;font-size:16px}
.qlist li::before{content:counter(q);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* teacher */
.tg{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tg h3{font-size:18px;margin-bottom:8px}
.tg table{width:100%;border-collapse:collapse;font-size:14px}
.tg td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
.tg td:first-child{white-space:nowrap;color:var(--accent);font-weight:700;width:86px}
.verse{font-family:"Gowun Batang",serif;font-size:22px;background:var(--accent-soft);border-radius:14px;padding:18px;text-align:center;margin-bottom:12px}
.verse small{display:block;font-family:"Noto Sans KR";font-size:13px;color:var(--accent);margin-top:4px}
.tg ul{margin:0;padding-left:18px;font-size:14px}
.tg li{margin:4px 0}
.msg{font-size:15px;border-left:3px solid var(--accent);padding-left:12px;margin:0 0 12px}

footer{padding:26px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
.theme-toggle{position:fixed;right:14px;top:14px;z-index:5;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;width:38px;height:38px;font-size:16px}

@media (max-width:900px){
  .sim{grid-template-columns:1fr}
  .slots{grid-template-columns:repeat(4,1fr)!important}
  .tg{grid-template-columns:1fr}
}
@media (max-width:560px){
  .stage{aspect-ratio:4/3}
  .days{grid-template-columns:repeat(4,1fr)!important}
  .slots{grid-template-columns:repeat(2,1fr)!important}
  .opts{grid-template-columns:1fr}
  .frame{grid-template-columns:1fr 34px 1fr;padding:14px;gap:8px}
  .fcell .e{display:none}
  .hero{padding-top:28px}
}
@media print{
  .theme-toggle,.nav,#sim,.controls,.days,#game .game-top button{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none}
  section{break-inside:avoid}
}

.btn.act{background:#1f2a48;color:#fff;border-color:#1f2a48}
.btn.act:hover{filter:brightness(1.2);color:#fff}
.ov{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ovc{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg);text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.ovc:hover{transform:translateY(-2px);border-color:var(--accent)}
.ovc .e{font-size:26px;line-height:1}
.ovc .t{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;margin:6px 0 2px}
.ovc .d{font-size:14px;color:var(--muted)}
.ovc .go{font-size:12px;color:var(--accent);font-weight:700;margin-top:6px}
.ov-note{padding:0 20px 20px;margin:0;color:var(--muted);font-size:14px}
.ov-extra{padding:0 20px 20px}
.oslots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.oslot{border:1px dashed var(--line);border-radius:12px;min-height:64px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.oslot .sh{font-size:12px;color:var(--accent);font-weight:700}
.oslot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.oslot.next{border-color:var(--accent);border-style:solid}
.item.bad{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.slot .sh small{display:block;font-family:"Noto Sans KR";font-weight:400;font-size:11px;color:var(--muted)}
.tl{display:grid;gap:0;margin-top:6px}
.tl-row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl-row b{color:var(--accent)}
.dim{width:100%;border-collapse:collapse;font-size:14px}
.dim td,.dim th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.dim th{color:var(--muted);font-weight:500}

</style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" title="밝게/어둡게">◐</button>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow" id="tags"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <nav class="nav">
      <a href="#sim">① 시뮬레이션</a>
      <a href="#frame">② 한눈에 보기</a>
      <a href="#game">③ 활동</a>
      <a href="#quiz">④ 퀴즈</a>
      <a href="#share">⑤ 나눔</a>
      <a href="#teacher">⑥ 교사 가이드</a>
    </nav>
  </header>

  <section id="sim">
    <div class="sec-head"><span class="num">01</span><h2 id="simTitle">이야기 시뮬레이션</h2>
      <p>‘다음 장면’을 누르면 이야기가 한 장면씩 펼쳐집니다. 장면에 따라 파란 버튼으로 직접 움직여 볼 수 있어요. 키보드 ← → 로도 넘길 수 있습니다.</p></div>
    <div class="sim">
      <div class="card stage-card">
        <div class="stage" id="stage">
          <canvas id="cv"></canvas>
          <div class="day-label"><span class="n" id="lblN"></span><span class="s" id="lblS"></span></div>
          <div class="decree" id="decree"></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="controls">
          <button class="btn" id="prev">◀ 이전</button>
          <button class="btn primary" id="next">다음 장면 ▶</button>
          <button class="btn" id="play">▶ 자동 재생</button>
          <span class="spacer"></span>
          <button class="btn act" id="action" style="display:none"></button>
        </div>
        <div class="days" id="days"></div>
      </div>
      <aside class="card panel" id="panel" aria-live="polite"></aside>
    </div>
  </section>

  <section id="frame">
    <div class="sec-head"><span class="num">02</span><h2 id="ovTitle"></h2><p id="ovDesc"></p></div>
    <div class="card" id="ovBox"></div>
  </section>

  <section id="game">
    <div class="sec-head"><span class="num">03</span><h2 id="gTitle"></h2><p id="gDesc"></p></div>
    <div class="card game">
      <div class="game-top">
        <span class="score" id="gScore"></span>
        <span class="spacer"></span>
        <button class="btn" id="gAnswer">정답 보기</button>
        <button class="btn" id="gReset">다시 하기</button>
      </div>
      <div class="pool" id="pool"></div>
      <div id="slotWrap"></div>
      <div class="game-msg" id="gMsg"></div>
    </div>
  </section>

  <section id="quiz">
    <div class="sec-head"><span class="num">04</span><h2>확인 퀴즈</h2><p>답을 고르면 바로 해설이 나옵니다.</p></div>
    <div class="card quiz" id="quizBox"></div>
  </section>

  <section id="share">
    <div class="sec-head"><span class="num">05</span><h2>생각과 나눔</h2><p>대상에 맞는 질문을 골라 쓰세요.</p></div>
    <div class="card"><div class="tabs" id="tabs"></div><ol class="qlist" id="qlist"></ol></div>
  </section>

  <section id="teacher">
    <div class="sec-head"><span class="num">06</span><h2>교사 가이드</h2><p>40분 수업 기준 흐름입니다. 인쇄하면 시뮬레이션은 빠지고 활동지와 가이드만 출력됩니다.</p></div>
    <div class="card tg" id="tg"></div>
  </section>

  <footer id="foot"></footer>
</div>
<script>
/* ===== 성경 이야기 교재 그래픽 라이브러리 (G) ===== */
var G=(function(){
var G={c:null,S:null};
var PI=Math.PI;
function cl(v,a,b){ return Math.max(a,Math.min(b,v)); }
G.clamp=cl;
G.lerp=function(a,b,t){ return a+(b-a)*t; };
G.hex=function(h){ h=h.replace("#",""); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; };
G.rgba=function(h,a){ var c=G.hex(h); return "rgba("+c[0]+","+c[1]+","+c[2]+","+(a==null?1:a)+")"; };
G.mix=function(h1,h2,t,a){ var x=G.hex(h1),y=G.hex(h2); return "rgba("+Math.round(x[0]+(y[0]-x[0])*t)+","+Math.round(x[1]+(y[1]-x[1])*t)+","+Math.round(x[2]+(y[2]-x[2])*t)+","+(a==null?1:a)+")"; };
G.shade=function(h,f,a){ var c=G.hex(h); return "rgba("+Math.round(cl(c[0]*f,0,255))+","+Math.round(cl(c[1]*f,0,255))+","+Math.round(cl(c[2]*f,0,255))+","+(a==null?1:a)+")"; };

G.fill=function(col){ var c=G.c; c.fillStyle=col; c.fillRect(0,0,G.S.W,G.S.H); };
G.skyGrad=function(top,bot,y0,y1,a){
  var c=G.c; var g=c.createLinearGradient(0,y0,0,y1); g.addColorStop(0,top); g.addColorStop(1,bot);
  c.globalAlpha=a==null?1:a; c.fillStyle=g; c.fillRect(0,y0,G.S.W,y1-y0); c.globalAlpha=1;
};
G.glow=function(x,y,r,col,a){
  if(a<=0) return; var c=G.c; var g=c.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,G.rgba(col,a)); g.addColorStop(1,G.rgba(col,0));
  c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill();
};
G.circle=function(x,y,r,col){ var c=G.c; c.fillStyle=col; c.beginPath(); c.arc(x,y,Math.max(0,r),0,7); c.fill(); };

    var lx=W*0.72, ly=gy(lx);

    c.globalAlpha=la; c.fillStyle="rgba(120,80,40,.85)"; c.fillRect(lx-3*k,ly-150*k,6*k,150*k); c.fillRect(lx-34*k,ly-118*k,68*k,6*k); c.globalAlpha=1;

<script>
(function(){
"use strict";
var ST=window.STORY, SC=ST.scenes, N=SC.length;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function ease(t){ t=clamp(t,0,1); return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

/* ---------- header ---------- */
$("tags").innerHTML=['<span class="tag gold">성경 이야기 #'+ST.id+'</span>','<span class="tag">'+ST.testament+' · '+ST.book+'</span>','<span class="tag">'+ST.ref+'</span>','<span class="tag">'+ST.aud+'</span>'].join("");
$("title").textContent=ST.title;
$("lead").innerHTML=ST.lead;
$("simTitle").textContent=ST.simTitle||"이야기 시뮬레이션";
$("foot").innerHTML="성경 이야기 교재 #"+ST.id+" · "+ST.title+" ("+ST.ref+"). 본문 설명은 학습을 위해 쉽게 풀어 쓴 것이므로, 수업 때는 반드시 성경 본문을 함께 펴서 읽어 주세요.";

/* ---------- canvas ---------- */
var cv=$("cv"), ctx=cv.getContext("2d");
var snap=document.createElement("canvas"), sctx=snap.getContext("2d"), snapA=0;
var S={ctx:ctx,W:0,H:0,k:1,DPR:1,time:0,dt:0,idx:0,raw:1,tr:1,sceneT:0,st:{},env:{}};
S.p=function(i){ return S.idx>i?1:(S.idx===i?S.tr:0); };
S.on=function(i){ return S.idx===i; };
S.stag=function(v,a,l){ return clamp((v-a)/l,0,1); };
S.ease=ease; S.clamp=clamp;
S.lerp=function(a,b,t){ return a+(b-a)*t; };
var seed=1;
S.seed=function(s){ seed=s; };
S.R=function(){ seed=(seed*9301+49297)%233280; return seed/233280; };
G.c=ctx; G.S=S;

function resize(){
  var r=cv.getBoundingClientRect();
  S.DPR=Math.min(2,window.devicePixelRatio||1);
  S.W=r.width; S.H=r.height; S.k=Math.min(S.W,S.H*1.25)/400;
  cv.width=Math.round(S.W*S.DPR); cv.height=Math.round(S.H*S.DPR);
  snap.width=cv.width; snap.height=cv.height;
  ctx.setTransform(S.DPR,0,0,S.DPR,0,0);
  if(ST.setup){ S.seed(7); ST.setup(S); }
}

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  S.dt=dt; S.time+=dt; S.sceneT+=dt;
  if(S.raw<1){ S.raw=Math.min(1,S.raw+dt/(SC[S.idx].dur||2.6)); }
  S.tr=ease(S.raw);
  if(S.W>0){
    ctx.save();
    ctx.clearRect(0,0,S.W,S.H);
    try{ ST.draw(S); }catch(e){ if(!S._err){ S._err=1; console.error(e); } }
    ctx.restore();
    if(snapA>0){
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=ease(snapA); ctx.drawImage(snap,0,0); ctx.restore();
      snapA-=dt/0.9;
    }
    if(SC[S.idx].flash && S.sceneT<0.9){
      var f=1-S.sceneT/0.9; ctx.fillStyle="rgba(255,250,235,"+(0.45*f*f)+")"; ctx.fillRect(0,0,S.W,S.H);
    }
  }
  requestAnimationFrame(frame);
}

cv.addEventListener("click",function(e){
  if(!ST.onClick) return;
  var r=cv.getBoundingClientRect();
  ST.onClick(S,e.clientX-r.left,e.clientY-r.top);
});

/* ---------- scene UI ---------- */
var daysEl=$("days"), panel=$("panel"), decree=$("decree"), hint=$("hint"),
    bPrev=$("prev"), bNext=$("next"), bPlay=$("play"), bAct=$("action");
var timers=[], autoTimer=null;
daysEl.style.setProperty("--n",N);
daysEl.innerHTML=SC.map(function(s,i){ return '<button class="dbtn" data-d="'+i+'"><b>'+(i+1)+'</b>'+s.short+'</button>'; }).join("");
daysEl.addEventListener("click",function(e){ var b=e.target.closest(".dbtn"); if(b){ stopAuto(); go(+b.dataset.d); } });

function showHint(txt,ms){ hint.textContent=txt; hint.classList.add("show"); timers.push(setTimeout(function(){ hint.classList.remove("show"); },ms||4500)); }
S.hint=showHint;

function renderPanel(){
  var d=SC[S.idx];
  panel.innerHTML=
    '<div class="ref">'+d.ref+'</div>'+
    '<h3>'+d.title+'</h3>'+
    '<p class="story">'+d.story+'</p>'+
    (d.chips&&d.chips.length?'<div class="made">'+d.chips.map(function(m){return '<span>'+m+'</span>';}).join("")+'</div>':'')+
    (d.key?'<div class="good">'+d.key+'</div>':'')+
    '<div class="think"><b>생각해 보기</b>'+d.think+'</div>'+
    (d.note?'<details class="tnote"><summary>교사 노트</summary><p style="margin:.5em 0 0">'+d.note+'</p></details>':'');
}
function setAction(){
  var a=SC[S.idx].action;
  if(a){ bAct.style.display=""; bAct.textContent=typeof a.label==="function"?a.label(S):a.label; }
  else bAct.style.display="none";
}
S.refreshAction=setAction;
bAct.onclick=function(){ var a=SC[S.idx].action; if(a){ a.run(S); setAction(); } };

function go(n){
  n=clamp(n,0,N-1);
  timers.forEach(clearTimeout); timers=[]; hint.classList.remove("show");
  if(n!==S.idx && S.W>0){ sctx.setTransform(1,0,0,1,0,0); sctx.clearRect(0,0,snap.width,snap.height); sctx.drawImage(cv,0,0); snapA=SC[n].noFade?0:1; }
  var prev=S.idx;
  S.idx=n; S.raw=0; S.tr=0; S.sceneT=0;
  if(ST.onEnter) ST.onEnter(S,n,prev);
  var d=SC[n];
  $("lblN").textContent=d.label; $("lblS").textContent=d.sub||"";
  decree.classList.remove("show"); void decree.offsetWidth;
  if(d.decree){ decree.innerHTML=d.decree; decree.classList.add("show"); }
  bPrev.disabled=n===0; bNext.disabled=n===N-1;
  bNext.textContent=n===N-1?"끝":"다음 장면 ▶";
  Array.prototype.forEach.call(daysEl.children,function(b,i){ b.classList.toggle("active",i===n); b.classList.toggle("done",i<n); });
  renderPanel(); setAction();
  if(d.hint) timers.push(setTimeout(function(){ showHint(d.hint); },d.hintAt||3000));
}
S.go=go;
bPrev.onclick=function(){ stopAuto(); go(S.idx-1); };
bNext.onclick=function(){ stopAuto(); go(S.idx+1); };
function stopAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; bPlay.textContent="▶ 자동 재생"; } }
bPlay.onclick=function(){
  if(autoTimer){ stopAuto(); return; }
  if(S.idx===N-1) go(0);
  bPlay.textContent="❚❚ 멈춤";
  autoTimer=setInterval(function(){ if(S.idx>=N-1){ stopAuto(); return; } go(S.idx+1); },ST.autoMs||9000);
};
document.addEventListener("keydown",function(e){
  if(e.target.closest&&e.target.closest("input,textarea")) return;
  if(e.key==="ArrowRight"){ stopAuto(); go(S.idx+1); }
  if(e.key==="ArrowLeft"){ stopAuto(); go(S.idx-1); }
});
if(window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener("resize",resize);
resize(); go(0); snapA=0;
requestAnimationFrame(frame);

/* ---------- overview ---------- */
var OV=ST.overview;
$("ovTitle").textContent=OV.title; $("ovDesc").innerHTML=OV.desc||"";
var oh="";
if(OV.cards){
  oh+='<div class="ov">'+OV.cards.map(function(c){ return '<button class="ovc" data-go="'+(c.go==null?"":c.go)+'"><div class="e">'+c.e+'</div><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div>'+(c.go!=null?'<div class="go">장면 '+(c.go+1)+' 보기 →</div>':'')+'</button>'; }).join("")+'</div>';
}
if(OV.html) oh+='<div class="ov-extra">'+OV.html+'</div>';
if(OV.note) oh+='<p class="ov-note">'+OV.note+'</p>';
$("ovBox").innerHTML=oh;
$("ovBox").addEventListener("click",function(e){
  var b=e.target.closest("[data-go]"); if(!b||b.dataset.go==="") return;
  stopAuto(); go(+b.dataset.go); $("sim").scrollIntoView({behavior:"smooth",block:"start"});
});

/* ---------- game ---------- */
var GM=ST.game;
$("gTitle").textContent=GM.title; $("gDesc").innerHTML=GM.desc;
var poolEl=$("pool"), wrap=$("slotWrap"), gScore=$("gScore"), gMsg=$("gMsg");
var sel=null, placed=0, tries=0, nextPos=0;
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function itemHTML(i){ var it=GM.items[i]; return '<button class="item" data-i="'+i+'">'+(it.e?'<span class="ic">'+it.e+'</span>':'')+it.n+'</button>'; }
function setupGame(){
  sel=null; placed=0; tries=0; nextPos=0; gMsg.textContent="";
  var order=shuffle(GM.items.map(function(_,i){return i;}));
  poolEl.innerHTML=order.map(itemHTML).join("");
  if(GM.type==="order"){
    wrap.innerHTML='<div class="oslots">'+GM.items.map(function(_,i){ return '<div class="oslot'+(i===0?" next":"")+'" data-p="'+i+'"><div class="sh">'+(GM.slotName?GM.slotName(i):(i+1)+"번째")+'</div></div>'; }).join("")+'</div>';
  } else {
    wrap.innerHTML='<div class="slots" style="--sn:'+(GM.cols||GM.slots.length)+'">'+GM.slots.map(function(s,i){ return '<button class="slot" data-d="'+i+'"><div class="sh">'+s+'</div></button>'; }).join("")+'</div>';
  }
  upd();
}
function upd(){ gScore.textContent="맞힌 카드 "+placed+" / "+GM.items.length+(tries?" · 시도 "+tries+"번":""); }
function ok(msg){ gMsg.style.color="var(--ok)"; gMsg.innerHTML=msg; }
function bad(msg){ gMsg.style.color="var(--bad)"; gMsg.innerHTML=msg; }
poolEl.addEventListener("click",function(e){
  var b=e.target.closest(".item"); if(!b||b.classList.contains("placed")) return;
  var i=+b.dataset.i;
  if(GM.type==="order"){
    tries++;
    if(i===nextPos){
      var slot=wrap.querySelector('[data-p="'+i+'"]');
      b.classList.add("placed"); slot.appendChild(b); slot.classList.remove("next"); slot.classList.add("filled");
      placed++; nextPos++;
      var nx=wrap.querySelector('[data-p="'+nextPos+'"]'); if(nx) nx.classList.add("next");
      ok(placed===GM.items.length?(GM.done||"🎉 모두 맞혔어요!"):"정답! 다음은 무엇일까요?");
    } else {
      b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
      bad("순서가 달라요. 시뮬레이션 장면을 떠올려 보세요.");
    }
    upd(); return;
  }
  Array.prototype.forEach.call(poolEl.children,function(c){ c.classList.remove("sel"); });
  sel=i; b.classList.add("sel");
  wrap.querySelectorAll(".slot").forEach(function(s){ s.classList.add("ready"); });
});
wrap.addEventListener("click",function(e){
  if(GM.type==="order") return;
  var s=e.target.closest(".slot"); if(!s||sel===null) return;
  tries++;
  var it=GM.items[sel], d=+s.dataset.d;
  if(it.k===d){
    var b=poolEl.querySelector('[data-i="'+sel+'"]'); b.classList.remove("sel"); b.classList.add("placed"); s.appendChild(b);
    placed++; sel=null;
    wrap.querySelectorAll(".slot").forEach(function(x){ x.classList.remove("ready"); });
    ok(placed===GM.items.length?(GM.done||"🎉 모두 맞혔어요!"):"정답! "+(it.why||""));
  } else {
    s.classList.remove("wrong"); void s.offsetWidth; s.classList.add("wrong");
    bad("다시 생각해 보세요."+(it.hint?" "+it.hint:""));
  }
  upd();
});
$("gReset").onclick=setupGame;
$("gAnswer").onclick=function(){
  Array.prototype.slice.call(poolEl.querySelectorAll(".item")).forEach(function(b){
    var i=+b.dataset.i; b.classList.remove("sel"); b.classList.add("placed");
    var slot=GM.type==="order"?wrap.querySelector('[data-p="'+i+'"]'):wrap.querySelector('[data-d="'+GM.items[i].k+'"]');
    slot.appendChild(b); if(GM.type==="order"){ slot.classList.add("filled"); slot.classList.remove("next"); }
  });
  placed=GM.items.length; sel=null; upd();
  wrap.querySelectorAll(".slot").forEach(function(x){ x.classList.remove("ready"); });
  gMsg.style.color="var(--muted)"; gMsg.textContent="정답을 펼쳤어요. ‘다시 하기’로 새로 도전할 수 있어요.";
};
setupGame();

/* ---------- quiz ---------- */
var QZ=ST.quiz, qb=$("quizBox"), qc=0, qd=0;
qb.innerHTML=QZ.map(function(q,i){
  return '<div class="q" data-q="'+i+'"><div class="qt"><span>Q'+(i+1)+'.</span>'+q.q+'</div><div class="opts">'+
    q.o.map(function(o,j){ return '<button class="opt" data-j="'+j+'">'+o+'</button>'; }).join("")+'</div><div class="exp">'+q.x+'</div></div>';
}).join("")+'<div class="quiz-score" id="qScore"></div>';
qb.addEventListener("click",function(e){
  var b=e.target.closest(".opt"); if(!b||b.disabled) return;
  var box=b.closest(".q"), i=+box.dataset.q, j=+b.dataset.j, q=QZ[i];
  box.querySelectorAll(".opt").forEach(function(o,k){ o.disabled=true; if(k===q.a) o.classList.add("right"); });
  if(j!==q.a) b.classList.add("wrongp"); else qc++;
  qd++; box.querySelector(".exp").classList.add("show");
  if(qd===QZ.length) $("qScore").textContent="결과: "+QZ.length+"문제 중 "+qc+"문제 정답"+(qc===QZ.length?" — 훌륭해요! 👏":"");
});

/* ---------- share ---------- */
var SH=ST.share, tabs=$("tabs"), ql=$("qlist"), keys=Object.keys(SH);
tabs.innerHTML=keys.map(function(k,i){ return '<button class="tab'+(i===0?" on":"")+'" data-k="'+k+'">'+k+'</button>'; }).join("");
function showShare(k){ ql.innerHTML=SH[k].map(function(q){ return "<li>"+q+"</li>"; }).join(""); }
tabs.addEventListener("click",function(e){ var b=e.target.closest(".tab"); if(!b) return;
  Array.prototype.forEach.call(tabs.children,function(t){ t.classList.toggle("on",t===b); }); showShare(b.dataset.k); });
showShare(keys[0]);

/* ---------- teacher ---------- */
var T=ST.teacher;
$("tg").innerHTML=
 '<div><div class="verse">'+T.verse+'<small>암송 구절 · '+T.verseRef+'</small></div>'+
 '<h3>핵심 메시지</h3><p class="msg">'+T.msg+'</p>'+
 '<h3>가르칠 때 기억할 점</h3><ul>'+T.tips.map(function(t){return "<li>"+t+"</li>";}).join("")+'</ul></div>'+
 '<div><h3>수업 흐름 (40분)</h3><table>'+T.flow.map(function(f){ return "<tr><td>"+f[0]+"</td><td>"+f[1]+"</td></tr>"; }).join("")+'</table>'+
 '<h3 style="margin-top:16px">준비물</h3><ul>'+T.prep.map(function(t){return "<li>"+t+"</li>";}).join("")+'</ul>'+
 '<p style="margin-top:14px"><button class="btn" onclick="window.print()">🖨 활동지·가이드 인쇄</button></p></div>';

/* ---------- theme ---------- */
$("themeBtn").onclick=function(){
  var root=document.documentElement, cur=root.getAttribute("data-theme");
  var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme",dark?"light":"dark");
};
})();

</script>
</body>
</html>
