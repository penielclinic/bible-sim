<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성경 이야기 교재</title>
<meta name="description" content="성경 66권 512편 이야기를 실감 나는 시뮬레이션으로 배우는 교회학교 교재">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7;--paper:#fffdf8;--ink:#2a251d;--muted:#7a7061;--line:#e6dccb;
  --accent:#a8741a;--accent-soft:#f5e7c8;--ot:#8a5a2b;--nt:#2f6d9e;--chip:#efe7d8;
  --shadow:0 6px 20px rgba(60,40,10,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12110f;--paper:#1c1a17;--ink:#eee7da;--muted:#a79f90;--line:#322e27;
  --accent:#e2b457;--accent-soft:#3a2f1b;--ot:#d9a06a;--nt:#6fa9df;--chip:#28251f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12110f;--paper:#1c1a17;--ink:#eee7da;--muted:#a79f90;--line:#322e27;
  --accent:#e2b457;--accent-soft:#3a2f1b;--ot:#d9a06a;--nt:#6fa9df;--chip:#28251f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
header h1{font-family:"Gowun Batang",serif;font-size:clamp(26px,4vw,36px);margin:0 0 4px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
body.embed header{display:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
input[type=search]{flex:1 1 240px}
select{flex:0 1 auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.count{margin-left:auto;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:18px 0 40px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.no{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{white-space:nowrap;flex:none;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip)}
.tag.ot{color:var(--ot)}.tag.nt{color:var(--nt)}
.card h3{font-family:"Gowun Batang",serif;font-size:18px;margin:0;line-height:1.35}
.card p{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.group{grid-column:1/-1;font-family:"Gowun Batang",serif;font-size:20px;font-weight:700;margin:10px 0 -4px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.group small{font-family:"Noto Sans KR";font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
@media (max-width:560px){.count{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="wrap">
  <h1>성경 이야기 교재</h1>
  <p>성경 66권 · 512편의 이야기를 시뮬레이션으로 만나 보세요</p>
</header>
<div class="bar"><div class="wrap">
  <div class="row">
    <input type="search" id="q" placeholder="번호, 제목, 인물, 성경책으로 찾기 (예: 94, 다윗, 요나)" aria-label="검색">
    <div class="seg" role="group" aria-label="구약/신약">
      <button type="button" data-t="" aria-pressed="true">전체</button>
      <button type="button" data-t="구약" aria-pressed="false">구약</button>
      <button type="button" data-t="신약" aria-pressed="false">신약</button>
    </div>
  </div>
  <div class="row">
    <select id="book" aria-label="성경책"><option value="">성경책 전체</option></select>
    <select id="theme" aria-label="주제"><option value="">주제 전체</option></select>
    <select id="sort" aria-label="정렬">
      <option value="no">번호 순</option>
      <option value="bible">성경 순서 (책별 묶기)</option>
    </select>
    <span class="chip-wrap row" style="gap:6px">
      <button type="button" class="chip" data-a="어린이" aria-pressed="false">어린이</button>
      <button type="button" class="chip" data-a="청소년" aria-pressed="false">청소년</button>
      <button type="button" class="chip" data-a="성인" aria-pressed="false">성인</button>
    </span>
    <span class="count" id="count"></span>
  </div>
</div></div>
<main class="wrap"><div class="grid" id="grid"></div></main>
<script>
const DATA = [{"no": 1, "title": "천지창조", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 1:1-2:3", "summary": "하나님이 말씀으로 빛과 하늘과 땅, 바다와 육지, 해와 달과 별, 동식물과 사람을 엿새 동안 창조하시고 일곱째 날에 안식하셨다.", "themes": ["창조와 섭리"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 2, "title": "에덴동산과 사람의 창조", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 2:4-25", "summary": "하나님이 흙으로 아담을 지어 생기를 불어넣으시고 에덴동산에 두셨으며, 아담의 갈빗대로 하와를 만들어 짝지어 주셨다.", "themes": ["창조와 섭리", "가정과 관계"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 3, "title": "선악과와 타락", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 3:1-24", "summary": "뱀의 유혹으로 아담과 하와가 선악을 알게 하는 나무의 열매를 먹고 하나님의 명령을 어겨 에덴동산에서 쫓겨났다.", "themes": ["죄와 타락"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 4, "title": "가인과 아벨", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 4:1-16", "summary": "가인이 자기 제물이 열납되지 않자 분노하여 동생 아벨을 죽였고, 하나님은 가인에게 표를 주어 보호하시되 유리하는 삶을 살게 하셨다.", "themes": ["죄와 타락", "분노 다스림"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 5, "title": "에녹이 하나님과 동행함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 5:21-24", "summary": "에녹은 므두셀라를 낳은 후 삼백 년을 하나님과 동행하다가 죽음을 보지 않고 하나님이 데려가셨다.", "themes": ["순종과 믿음"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 6, "title": "노아가 방주를 지음", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 6:1-22", "summary": "사람의 죄악이 세상에 가득하자 하나님이 홍수로 심판하기로 하시고, 의인 노아에게 방주를 지어 가족과 동물들을 구원할 것을 명하셨다.", "themes": ["순종과 믿음", "하나님의 심판"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 7, "title": "홍수 심판과 방주", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 7:1-8:19", "summary": "사십 주야 비가 내려 온 땅이 물에 잠기고 방주에 탄 사람과 동물만 살아남았으며, 물이 줄자 비둘기가 감람나무 잎을 물고 돌아와 육지가 드러났음을 알렸다.", "themes": ["하나님의 심판", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 8, "title": "무지개 언약", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 9:1-17", "summary": "방주에서 나온 노아에게 하나님이 다시는 물로 세상을 멸하지 않으시겠다는 언약을 맺으시고 무지개를 그 증거로 주셨다.", "themes": ["하나님의 언약"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 9, "title": "바벨탑 사건", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 11:1-9", "summary": "사람들이 하늘에 닿는 탑을 쌓아 이름을 내려 하자 하나님이 언어를 혼잡하게 하여 그들을 온 땅에 흩으셨다.", "themes": ["겸손과 교만"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 10, "title": "아브람을 부르심", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 12:1-9", "summary": "하나님이 아브람에게 고향과 친척을 떠나 지시할 땅으로 가라 명하시고 그를 통해 큰 민족을 이루고 모든 족속이 복을 얻게 하겠다 약속하셨다.", "themes": ["순종과 믿음", "하나님의 언약"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 11, "title": "아브람과 롯의 분리", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 13:1-18", "summary": "아브람과 롯의 소유가 많아져 다툼이 생기자 아브람은 롯에게 먼저 선택권을 양보했고, 롯은 요단 온 들을 택해 소돔 근처로 옮겼다.", "themes": ["가정과 관계", "겸손과 교만"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 12, "title": "아브람이 롯을 구출하고 멜기세덱을 만남", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 14:1-24", "summary": "동방 왕들에게 롯이 사로잡히자 아브람이 사병을 거느리고 구출했고, 돌아오는 길에 살렘 왕 멜기세덱이 그를 축복하며 떡과 포도주를 내어주었다.", "themes": ["인도하심과 보호", "예배와 경배"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 13, "title": "아브람과 맺으신 횃불 언약", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 15:1-21", "summary": "하나님이 후사가 없는 아브람에게 하늘의 별처럼 많은 자손을 약속하시고, 쪼갠 짐승 사이로 타는 횃불이 지나가는 것으로 언약을 확증하셨다.", "themes": ["순종과 믿음", "하나님의 언약"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 14, "title": "하갈과 이스마엘의 출생", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 16:1-16", "summary": "자녀가 없던 사래가 여종 하갈을 통해 아들을 얻게 했으나 하갈이 사래를 무시하다 광야로 도망하였고, 하나님의 천사가 그를 만나 돌아가라 하시며 이스마엘의 출생을 예고하셨다.", "themes": ["하나님의 언약", "인도하심과 보호"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 15, "title": "할례 언약과 아브라함으로 개명", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 17:1-27", "summary": "하나님이 아브람과 사래의 이름을 아브라함과 사라로 바꾸시고 언약의 표징으로 할례를 명하시며 사라를 통해 아들 이삭을 주시겠다 약속하셨다.", "themes": ["하나님의 언약"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 16, "title": "세 나그네의 방문과 이삭 출생 예고", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 18:1-15", "summary": "마므레 상수리나무 곁에서 나그네를 대접한 아브라함에게 하나님이 내년에 사라가 아들을 낳을 것을 예고하시니 사라는 속으로 웃었다.", "themes": ["순종과 믿음", "사랑과 섬김"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 17, "title": "아브라함의 중보기도", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 18:16-33", "summary": "소돔을 멸하려는 계획을 들은 아브라함이 의인 오십 명부터 열 명까지 낮춰가며 그 성을 위해 간절히 중보기도 하였다.", "themes": ["기도와 응답"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 18, "title": "소돔과 고모라의 멸망", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 19:1-29", "summary": "소돔의 죄악이 가득하여 하나님이 유황과 불로 그 성을 멸하실 때 천사들이 롯의 가족을 구원해 피신시켰으나 뒤돌아본 롯의 아내는 소금 기둥이 되었다.", "themes": ["하나님의 심판", "순종과 믿음"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 19, "title": "이삭의 출생", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 21:1-7", "summary": "하나님의 약속대로 사라가 백 세 된 아브라함에게서 아들 이삭을 낳으니 사라가 웃음을 얻었다고 고백하였다.", "themes": ["하나님의 언약"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 20, "title": "아브라함이 이삭을 번제로 드리라는 시험", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 22:1-19", "summary": "하나님이 아브라함에게 독자 이삭을 번제로 드리라 명하시자 그가 순종하여 모리아 산으로 올라갔고, 마지막 순간 하나님이 수풀에 걸린 숫양을 예비하여 이삭을 대신하게 하셨다.", "themes": ["순종과 믿음", "하나님의 구원"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 21, "title": "이삭의 신부 리브가를 구함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 24:1-67", "summary": "아브라함의 종이 하나님께 기도하며 우물가에서 낙타에게 물을 길어주는 리브가를 이삭의 신붓감으로 인도받아 데려왔다.", "themes": ["기도와 응답", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 22, "title": "에서와 야곱의 출생, 장자권을 팔다", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 25:19-34", "summary": "리브가가 쌍둥이 에서와 야곱을 낳았고, 훗날 에서는 배고픔 때문에 팥죽 한 그릇에 장자의 명분을 야곱에게 팔았다.", "themes": ["지혜와 분별"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 23, "title": "야곱이 에서의 축복을 가로챔", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 27:1-40", "summary": "눈이 어두워진 이삭이 장자 에서에게 축복하려 하자 리브가와 야곱이 속임수를 써서 야곱이 대신 축복을 받았고, 이 일로 에서의 분노를 사 야곱은 집을 떠나게 되었다.", "themes": ["가정과 관계", "죄와 타락"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 24, "title": "야곱의 사다리 꿈(벧엘)", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 28:10-22", "summary": "도망하던 야곱이 광야에서 돌을 베고 자다가 하늘에 닿은 사다리와 오르내리는 천사들을 보았고, 하나님이 아브라함의 언약을 그에게도 이어 주겠다 약속하셨다.", "themes": ["하나님의 언약", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 25, "title": "야곱이 라반의 집에서 레아와 라헬을 얻음", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 29:1-30", "summary": "야곱이 외삼촌 라반의 집에서 라헬을 사랑하여 칠 년을 섬겼으나 라반의 속임수로 먼저 레아와 결혼하고 다시 칠 년을 더 섬겨 라헬을 얻었다.", "themes": ["순종과 믿음", "가정과 관계"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 26, "title": "야곱이 얍복강에서 천사와 씨름함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 32:22-32", "summary": "에서를 만나기 전날 밤 야곱이 얍복강 나루에서 한 사람과 밤새도록 씨름하며 축복을 구했고, 환도뼈가 위골된 채 이스라엘이라는 새 이름을 받았다.", "themes": ["기도와 응답", "하나님의 언약"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 27, "title": "야곱과 에서의 화해", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 33:1-17", "summary": "이십 년 만에 만난 에서가 두려워하던 야곱을 오히려 달려와 안고 입 맞추며 화해하였다.", "themes": ["회개와 용서", "가정과 관계"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 28, "title": "요셉의 꿈", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 37:1-11", "summary": "야곱이 요셉을 편애하여 채색옷을 지어 입혔고, 요셉이 형들의 곡식단과 해와 달과 별이 자신에게 절하는 꿈을 꾸어 형들의 미움을 샀다.", "themes": ["하나님의 섭리", "가정과 관계"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 29, "title": "요셉이 형들에 의해 팔려감", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 37:12-36", "summary": "형들이 요셉을 시기하여 죽이려다 은 이십에 미디안 상인에게 팔았고, 그의 옷에 피를 묻혀 야곱에게 요셉이 죽은 것처럼 속였다.", "themes": ["하나님의 섭리", "시기와 갈등"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 30, "title": "유다와 다말", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 38:1-30", "summary": "유다가 며느리 다말과의 언약을 저버리자 다말이 지혜롭게 행하여 자신의 권리를 되찾았고, 이 사건은 훗날 다윗의 계보로 이어졌다.", "themes": ["하나님의 섭리"], "audience": ["성인"], "style": "v1"}, {"no": 31, "title": "요셉과 보디발의 아내", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 39:1-20", "summary": "애굽 시위대장 보디발의 집에서 형통하던 요셉이 주인의 아내의 유혹을 단호히 거절하다 누명을 쓰고 감옥에 갇혔다.", "themes": ["고난과 인내", "충성과 신실함"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 32, "title": "요셉이 옥에서 꿈을 해몽함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 40:1-23", "summary": "감옥에서 요셉이 바로의 두 관원장의 꿈을 하나님이 주신 지혜로 해몽했고, 그 해석대로 한 사람은 복직되고 한 사람은 처형되었다.", "themes": ["고난과 인내", "지혜와 분별"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 33, "title": "요셉이 바로의 꿈을 해몽하고 총리가 됨", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 41:1-40", "summary": "바로가 꾼 일곱 암소와 이삭의 꿈을 요셉이 앞으로 있을 칠 년 풍년과 칠 년 흉년으로 해석하고 대책을 제안하니, 바로가 요셉을 애굽의 총리로 세웠다.", "themes": ["하나님의 섭리", "지혜와 분별"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 34, "title": "요셉의 형들이 애굽에 곡식을 사러 옴", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 42:1-38", "summary": "가나안에 흉년이 들자 요셉의 형들이 애굽에 곡식을 사러 왔고, 총리가 된 요셉을 알아보지 못한 채 그 앞에 엎드렸다.", "themes": ["하나님의 섭리"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 35, "title": "유다가 베냐민을 위해 자신을 내어놓음", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 44:1-34", "summary": "요셉이 형들을 시험하기 위해 베냐민의 자루에 은잔을 넣게 하자, 한때 요셉을 팔았던 유다가 아버지를 생각하며 자신이 대신 종이 되겠다고 간청하였다.", "themes": ["회개와 용서", "가정과 관계"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 36, "title": "요셉이 형들에게 자신을 알림", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 45:1-28", "summary": "더 이상 참지 못한 요셉이 형들 앞에서 자신이 요셉임을 밝히며 울었고, 하나님이 생명을 구원하시려고 자신을 먼저 보내셨다 말하며 형들을 위로하였다.", "themes": ["회개와 용서", "하나님의 섭리"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 37, "title": "야곱 가족이 애굽으로 이주함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 46:1-7,27-30", "summary": "야곱이 온 가족을 이끌고 애굽으로 내려가는 길에 브엘세바에서 하나님이 함께하시겠다 약속하셨고, 요셉과 재회한 야곱은 이제 죽어도 여한이 없다고 고백했다.", "themes": ["하나님의 언약", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 38, "title": "야곱이 열두 아들을 축복하고 죽음", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 49:1-33", "summary": "죽음을 앞둔 야곱이 열두 아들을 불러 각 지파의 미래를 예언적으로 축복하고 가나안 땅에 장사되기를 부탁한 후 숨을 거두었다.", "themes": ["충성과 신실함", "가정과 관계"], "audience": ["성인"], "style": "v1"}, {"no": 39, "title": "요셉이 형들을 용서함", "testament": "구약", "book": "창세기", "book_order": 1, "ref": "창 50:15-21", "summary": "야곱이 죽은 후 형들이 보복을 두려워하자 요셉은 형들이 악을 계획했으나 하나님이 선으로 바꾸어 오늘의 구원을 이루셨다며 그들을 위로하고 용서하였다.", "themes": ["회개와 용서", "하나님의 섭리"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 40, "title": "애굽에서 학대받는 이스라엘", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 1:1-22", "summary": "이스라엘 백성이 번성하자 두려움을 느낀 새 바로가 그들을 학대하고 남자 아기를 죽이라 명했으나, 산파들은 하나님을 경외하여 그 명을 거부했다.", "themes": ["순종과 믿음", "용기와 결단"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 41, "title": "모세의 출생과 구조", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 2:1-10", "summary": "모세의 어머니가 아기를 갈대 상자에 담아 나일강에 띄웠고, 바로의 딸이 그를 발견해 길러 모세라 이름 지었다.", "themes": ["하나님의 섭리", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 42, "title": "모세가 미디안으로 도망함", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 2:11-25", "summary": "장성한 모세가 동족을 학대하는 애굽인을 쳐 죽이고 발각되자 미디안으로 도망하여 목자가 되었다.", "themes": ["순종과 믿음", "인도하심과 보호"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 43, "title": "떨기나무 불꽃과 모세를 부르심", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 3:1-4:17", "summary": "호렙산에서 불이 붙었으나 타지 않는 떨기나무를 본 모세에게 하나님이 나타나 이스라엘을 구원하라 명하시며 '스스로 있는 자'라는 이름을 알려주셨다.", "themes": ["순종과 믿음", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 44, "title": "바로 앞에 선 모세, 첫 거절", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 5:1-6:1", "summary": "모세와 아론이 바로에게 백성을 보내라 요구했으나 바로는 오히려 노역을 더 무겁게 하여 백성의 원망을 샀다.", "themes": ["고난과 인내", "순종과 믿음"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 45, "title": "아홉 가지 재앙", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 7:14-10:29", "summary": "하나님이 물이 피로 변함, 개구리, 이, 파리, 가축의 죽음, 악성 종기, 우박, 메뚜기, 흑암의 아홉 재앙으로 애굽을 치셨으나 바로는 마음이 완악하여 계속 거절했다.", "themes": ["하나님의 심판", "순종과 믿음"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 46, "title": "유월절 제정과 장자의 죽음", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 11:1-12:30", "summary": "하나님이 마지막 재앙으로 애굽의 모든 장자를 치실 것을 예고하시며 어린양의 피를 문설주에 바른 집은 재앙이 넘어가는 유월절을 제정하셨다.", "themes": ["하나님의 구원", "예배와 경배"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 47, "title": "홍해를 건넘", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 13:17-14:31", "summary": "애굽 군대에 쫓기던 이스라엘 백성 앞에서 모세가 지팡이를 들자 바다가 갈라져 마른 땅으로 건너고, 뒤따르던 애굽 군대는 물에 잠겼다.", "themes": ["하나님의 구원", "인도하심과 보호"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 48, "title": "마라의 쓴물과 만나·메추라기", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 15:22-16:36", "summary": "마라의 쓴물이 나무로 인해 달게 되었고, 광야에서 굶주린 백성에게 하나님이 매일 만나와 메추라기를 내려 먹이셨다.", "themes": ["인도하심과 보호", "기도와 응답"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 49, "title": "반석에서 물이 남과 아말렉과의 전쟁", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 17:1-16", "summary": "르비딤에서 목마른 백성을 위해 반석에서 물을 내셨고, 아말렉과의 전쟁에서는 모세가 손을 들면 이기고 내리면 지므로 아론과 훌이 그의 팔을 붙들어 주었다.", "themes": ["가정과 관계", "기도와 응답"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 50, "title": "이드로의 조언과 재판관 세움", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 18:1-27", "summary": "장인 이드로가 홀로 모든 백성을 재판하느라 지친 모세에게 능력 있는 자들을 세워 일을 나누라 조언했고, 모세는 그 지혜를 받아들였다.", "themes": ["지도자의 리더십", "지혜와 분별"], "audience": ["성인"], "style": "v1"}, {"no": 51, "title": "시내산 강림과 십계명", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 19:1-20:21", "summary": "하나님이 우레와 번개, 빽빽한 구름 가운데 시내산에 강림하시어 십계명을 비롯한 언약의 법을 백성에게 주셨다.", "themes": ["율법과 계명"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 52, "title": "금송아지 사건", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 32:1-35", "summary": "모세가 산에 오래 머물자 백성이 아론에게 금송아지를 만들게 하여 우상숭배에 빠졌고, 산에서 내려온 모세는 크게 진노하며 율법판을 깨뜨렸다.", "themes": ["우상숭배 경계", "순종과 믿음"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 53, "title": "모세가 하나님의 영광을 구함", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 33:12-34:9", "summary": "금송아지 사건 이후 모세가 하나님의 영광을 보여달라 간구하자 하나님이 그의 등을 지나가시며 자신의 선하심과 이름을 선포하셨다.", "themes": ["기도와 응답", "예배와 경배"], "audience": ["성인"], "style": "v1"}, {"no": 54, "title": "성막을 위한 자원 예물과 완성", "testament": "구약", "book": "출애굽기", "book_order": 2, "ref": "출 35:4-40:38", "summary": "백성이 자원하여 예물을 드려 성막의 재료를 마련했고, 완성된 성막에 구름이 덮이며 여호와의 영광이 충만히 임하였다.", "themes": ["예배와 경배", "사랑과 섬김"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 55, "title": "아론의 제사장 위임식", "testament": "구약", "book": "레위기", "book_order": 3, "ref": "레 8:1-9:24", "summary": "모세가 하나님의 명대로 아론과 그 아들들에게 제사장 옷을 입히고 기름을 부어 위임했고, 첫 제사 후 여호와의 영광이 나타나 불이 내려와 제물을 살랐다.", "themes": ["예배와 경배", "율법과 계명"], "audience": ["성인"], "style": "v1"}, {"no": 56, "title": "나답과 아비후의 죽음", "testament": "구약", "book": "레위기", "book_order": 3, "ref": "레 10:1-7", "summary": "아론의 아들 나답과 아비후가 하나님이 명하지 않은 다른 불로 분향하다가 여호와 앞에서 불이 나와 죽임을 당했다.", "themes": ["예배와 경배", "순종과 믿음"], "audience": ["성인"], "style": "v1"}, {"no": 57, "title": "대속죄일 규례", "testament": "구약", "book": "레위기", "book_order": 3, "ref": "레 16:1-34", "summary": "일 년에 한 번 대제사장이 지성소에 들어가 속죄제를 드리고, 아사셀 염소에게 백성의 죄를 지워 광야로 보내는 대속죄일 규례가 주어졌다.", "themes": ["하나님의 구원", "회개와 용서"], "audience": ["성인"], "style": "v1"}, {"no": 58, "title": "희년 규례", "testament": "구약", "book": "레위기", "book_order": 3, "ref": "레 25:1-55", "summary": "하나님이 칠 년마다 안식년을, 오십 년마다 희년을 지켜 땅을 쉬게 하고 종을 자유케 하며 팔린 기업을 되돌려주라 명하셨다.", "themes": ["율법과 계명", "사랑과 섬김"], "audience": ["성인"], "style": "v1"}, {"no": 59, "title": "열두 정탐꾼과 백성의 반역", "testament": "구약", "book": "민수기", "book_order": 4, "ref": "민 13:1-14:38", "summary": "가나안을 정탐한 열두 명 중 열 명은 두려움에 부정적 보고를 했으나 여호수아와 갈렙은 믿음으로 올라가자 했고, 백성이 그들을 돌로 치려 하자 하나님은 그 세대가 광야에서 죽으리라 선고하셨다.", "themes": ["순종과 믿음", "용기와 결단"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 60, "title": "고라의 반역", "testament": "구약", "book": "민수기", "book_order": 4, "ref": "민 16:1-35", "summary": "고라와 그 무리가 모세와 아론의 지도력에 도전하여 반역했으나 땅이 갈라져 그들을 삼키고 불이 내려와 나머지를 태웠다.", "themes": ["지도자의 리더십", "시기와 갈등"], "audience": ["성인"], "style": "v1"}, {"no": 61, "title": "놋뱀 사건", "testament": "구약", "book": "민수기", "book_order": 4, "ref": "민 21:4-9", "summary": "백성이 다시 원망하자 불뱀이 물어 많은 사람이 죽었고, 모세가 하나님의 명대로 놋뱀을 만들어 장대에 달자 그것을 본 자마다 살았다.", "themes": ["하나님의 구원", "순종과 믿음"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 62, "title": "발람과 나귀", "testament": "구약", "book": "민수기", "book_order": 4, "ref": "민 22:1-38", "summary": "모압 왕 발락이 이스라엘을 저주하도록 발람을 청했으나, 하나님이 나귀의 입을 열어 발람을 꾸짖으시고 결국 발람은 저주 대신 축복만을 선포하게 되었다.", "themes": ["하나님의 섭리", "지혜와 분별"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 63, "title": "여호수아를 후계자로 세움", "testament": "구약", "book": "민수기", "book_order": 4, "ref": "민 27:12-23", "summary": "약속의 땅에 들어가지 못하게 된 모세가 하나님의 명대로 여호수아에게 안수하여 백성을 이끌 후계자로 세웠다.", "themes": ["지도자의 리더십", "충성과 신실함"], "audience": ["성인"], "style": "v1"}, {"no": 64, "title": "쉐마: 이스라엘아 들으라", "testament": "구약", "book": "신명기", "book_order": 5, "ref": "신 6:1-9", "summary": "모세가 백성에게 마음과 뜻과 힘을 다해 하나님을 사랑하고 그 말씀을 자녀에게 부지런히 가르치라고 당부하였다.", "themes": ["순종과 믿음", "가정과 관계"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 65, "title": "생명과 복, 죽음과 저주 중 택하라", "testament": "구약", "book": "신명기", "book_order": 5, "ref": "신 30:11-20", "summary": "모세가 하나님의 말씀은 멀리 있지 않고 마음에 있다 말하며, 백성에게 생명과 복 혹은 죽음과 저주 중에서 생명을 택하라고 권면하였다.", "themes": ["순종과 믿음", "용기와 결단"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 66, "title": "모세의 죽음", "testament": "구약", "book": "신명기", "book_order": 5, "ref": "신 34:1-12", "summary": "백이십 세의 모세가 느보산에서 약속의 땅을 바라본 후 그 땅에 들어가지 못한 채 죽었고, 하나님이 친히 그를 장사하셨다.", "themes": ["충성과 신실함", "고난과 인내"], "audience": ["성인"], "style": "v1"}, {"no": 67, "title": "라합과 정탐꾼", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 2:1-24", "summary": "여리고에 보낸 두 정탐꾼을 기생 라합이 숨겨 보호하며 자기 가족을 살려달라 요청했고, 정탐꾼들은 붉은 줄을 창에 매달면 구원받으리라 약속했다.", "themes": ["순종과 믿음", "하나님의 구원"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 68, "title": "요단강을 건넘", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 3:1-4:24", "summary": "제사장들이 언약궤를 메고 요단강에 발을 내딛자 강물이 멈춰 백성이 마른 땅으로 건넜고, 열두 지파를 따라 기념비를 세웠다.", "themes": ["순종과 믿음", "하나님의 구원"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 69, "title": "여리고 성 함락", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 6:1-27", "summary": "하나님의 지시대로 이스라엘 백성이 엿새 동안 여리고 성을 돌고 일곱째 날 일곱 바퀴를 돈 후 외치자 성벽이 무너졌다.", "themes": ["순종과 믿음", "하나님의 구원"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 70, "title": "아간의 범죄와 아이 성 패배", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 7:1-26", "summary": "여리고에서 바친 물건을 몰래 취한 아간의 범죄로 인해 이스라엘이 작은 아이 성 전투에서 패배했고, 죄가 드러난 아간은 심판을 받았다.", "themes": ["죄와 타락", "충성과 신실함"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 71, "title": "기브온 족속의 속임수", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 9:1-27", "summary": "기브온 사람들이 먼 나라에서 온 것처럼 속여 이스라엘과 화친 조약을 맺었고, 이스라엘 지도자들은 하나님께 묻지 않고 성급히 맹세하여 훗날 이를 지키기 위해 애썼다.", "themes": ["지혜와 분별"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 72, "title": "태양이 멈춘 전쟁", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 10:1-15", "summary": "기브온을 도우러 나선 여호수아가 전쟁 중 하나님께 태양이 머물기를 구하자 하루 동안 해가 지지 않아 이스라엘이 완전한 승리를 거두었다.", "themes": ["하나님의 구원", "기도와 응답"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 73, "title": "여호수아의 마지막 당부와 언약 갱신", "testament": "구약", "book": "여호수아", "book_order": 6, "ref": "수 23:1-24:28", "summary": "늙은 여호수아가 백성을 세겜에 모아 지난날 하나님의 신실하심을 회고하며 오늘날 섬길 자를 택하라 권면했고, 백성은 여호와를 섬기겠다 언약했다.", "themes": ["순종과 믿음", "충성과 신실함"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 74, "title": "사사 시대의 반복되는 패턴", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 2:6-23", "summary": "여호수아 세대가 지나자 백성은 우상을 섬기다 압제를 받고 부르짖으면 하나님이 사사를 세워 구원하시는 패턴이 사사기 내내 반복되었다.", "themes": ["죄와 타락", "하나님의 구원"], "audience": ["성인"], "style": "v1"}, {"no": 75, "title": "드보라와 바락", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 4:1-5:31", "summary": "여선지자 드보라가 바락에게 가나안 군대장관 시스라와 싸우라 명했고, 승리 후 도망친 시스라는 야엘의 장막에서 죽임을 당했다.", "themes": ["지도자의 리더십", "용기와 결단"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 76, "title": "기드온의 부르심과 삼백 용사", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 6:1-7:25", "summary": "두려움 많던 기드온이 하나님의 부르심을 받아 양털 표징으로 확인받고, 삼만 이천 명 중 삼백 명만으로 미디안 대군을 물리쳤다.", "themes": ["하나님의 구원", "용기와 결단"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 77, "title": "아비멜렉의 반역과 몰락", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 8:22-9:57", "summary": "기드온의 아들 아비멜렉이 칠십 형제를 죽이고 스스로 왕이 되었으나 결국 세겜 사람들의 배신과 한 여인이 던진 맷돌에 맞아 비참하게 죽었다.", "themes": ["시기와 갈등", "겸손과 교만"], "audience": ["성인"], "style": "v1"}, {"no": 78, "title": "입다와 그의 서원", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 11:1-40", "summary": "버림받았던 입다가 암몬과의 전쟁에서 사사로 부름받아 승리했으나, 경솔한 서원으로 인해 자신의 딸을 잃는 슬픔을 겪었다.", "themes": ["지혜와 분별", "고난과 인내"], "audience": ["성인"], "style": "v1"}, {"no": 79, "title": "삼손의 출생과 부르심", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 13:1-25", "summary": "자녀가 없던 마노아 부부에게 천사가 나타나 나실인으로 구별된 아들 삼손의 출생을 예고하였다.", "themes": ["하나님의 섭리", "순종과 믿음"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 80, "title": "삼손과 들릴라", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 16:1-31", "summary": "삼손이 들릴라의 거듭된 유혹에 넘어가 자신의 힘의 비밀을 말했다가 머리털이 잘리고 두 눈이 뽑혔으나, 마지막 기도로 다곤 신전을 무너뜨리며 죽었다.", "themes": ["죄와 타락", "회개와 용서"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 81, "title": "레위인의 첩 사건과 도덕적 혼란", "testament": "구약", "book": "사사기", "book_order": 7, "ref": "삿 19:1-21:25", "summary": "기브아에서 벌어진 참혹한 사건으로 이스라엘 지파들 간에 내전이 일어났고, '그 때에는 왕이 없으므로 각자 자기 소견에 옳은 대로 행하였더라'는 말씀으로 사사기가 끝난다.", "themes": ["지도자의 리더십", "하나님의 심판"], "audience": ["성인"], "style": "v1"}, {"no": 82 le": "백성이 왕을 요구함", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 8:1-22", "summary": "늙은 사무엘의 아들들이 부패하자 백성은 다른 나라처럼 왕을 세워달라 요구했고, 하나님은 이를 자신을 버리는 것으로 여기셨지만 백성의 요구를 허락하셨다.", "themes": ["지도자의 리더십", "순종과 믿음"], "audience": ["성인"], "style": "v1"}, {"no": 90, "title": "사울이 왕으로 기름부음 받음", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 9:1-10:27", "summary": "아버지의 잃어버린 나귀를 찾으러 나섰던 사울이 사무엘을 만나 이스라엘의 초대 왕으로 기름부음을 받았다.", "themes": ["하나님의 섭리", "지도자의 리더십"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 91, "title": "사울이 제사를 잘못 드려 책망받음", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 13:1-14", "summary": "블레셋과의 전쟁 중 사무엘을 기다리지 못한 사울이 제사장이 아님에도 번제를 직접 드렸다가 사무엘에게 책망을 받고 왕조가 이어지지 못하리라는 말을 들었다.", "themes": ["순종과 믿음", "겸손과 교만"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 92, "title": "사울이 아말렉을 진멸하지 않아 버림받음", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 15:1-35", "summary": "하나님이 아말렉을 진멸하라 명하셨으나 사울이 좋은 것들을 남기고 자기 뜻대로 행하자, 사무엘은 순종이 제사보다 낫다고 책망하며 그가 왕위에서 버림받았음을 선포했다.", "themes": ["순종과 믿음", "겸손과 교만"], "audience": ["청소년", "성인"], "style": "v1"}, {"no": 93, "title": "다윗이 왕으로 기름부음 받음", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 16:1-13", "summary": "하나님이 사무엘을 이새의 집으로 보내 외모가 아닌 중심을 보시고 막내 다윗을 이스라엘의 왕으로 택하여 기름 붓게 하셨다.", "themes": ["지혜와 분별", "하나님의 섭리"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 94, "title": "다윗과 골리앗", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 17:1-58", "summary": "블레셋 거인 골리앗이 이스라엘을 조롱할 때 어린 다윗이 물맷돌 하나로 그를 쓰러뜨리며 전쟁이 여호와께 속했음을 선포했다.", "themes": ["순종과 믿음", "용기와 결단"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 95, "title": "다윗과 요나단의 우정", "testament": "구약", "book": "사무엘상", "book_order": 9, "ref": "삼상 18:1-4,20:1-42", "summary": "사울의 아들 요나단이 다윗을 자기 생명처럼 사랑하여 언약을 맺었고, 아버지 사울이 다윗을 죽이려 하자 위험을 무릅쓰고 그에게 사실을 알려주었다.", "themes": ["가정과 관계", "충성과 신실함"], "audience": ["어린이", "청소년", "성인"], "style": "v1"}, {"no": 96, "title": "다윗이 사울을 살려줌", "testam  ["성인"], "style": "v2"}, {"no": 356, "title": "부활하신 그리스도의 환상", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 1:9-20", "summary": "밧모섬에 유배된 요한이 주의 날에 성령에 감동되어 촛대 사이를 거니시며 해같이 빛나는 얼굴을 가지신 부활하신 그리스도를 보고 엎드러지니 그가 손을 얹으며 '두려워하지 말라 나는 처음이요 마지막이라' 말씀하셨다.", "themes": ["예수 그리스도의 정체성", "인도하심과 보호"], "audience": ["청소년", "성인"], "style": "v2"}, {"no": 357, "title": "일곱 교회에게 보내는 편지", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 2:1-3:22", "summary": "그리스도는 에베소, 서머나, 버가모, 두아디라, 사데, 빌라델비아, 라오디게아 일곱 교회 각각에게 칭찬과 책망, 권면의 말씀을 보내시며 이기는 자에게 주실 약속을 전하셨다.", "themes": ["교회와 공동체", "회개와 용서"], "audience": ["성인"], "style": "v2"}, {"no": 358, "title": "하늘 보좌의 환상", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 4:1-11", "summary": "하늘 문이 열려 하늘에 보좌가 있고 그 위에 앉으신 이의 영광 가운데, 이십사 장로와 네 생물이 밤낮 쉬지 않고 '거룩하다 거룩하다 거룩하다' 찬양하며 경배하는 모습을 요한이 보았다.", "themes": ["예배와 경배", "예수 그리스도의 정체성"], "audience": ["청소년", "성인"], "style": "v2"}, {"no": 359, "title": "일곱 인으로 봉한 두루마리와 어린 양", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 5:1-14", "summary": "아무도 열 수 없던 두루마리를 오직 죽임을 당하신 어린 양만이 합당하다 하여 취하시니 모든 피조물이 '죽임을 당하신 어린 양은 능력과 부와 지혜와 힘과 존귀와 영광과 찬송을 받으시기에 합당하도다' 노래했다.", "themes": ["예수 그리스도의 정체성", "예배와 경배"], "audience": ["청소년", "성인"], "style": "v2"}, {"no": 360, "title": "네 말 탄 자(인봉 심판)", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 6:1-17", "summary": "어린 양이 인을 하나씩 떼실 때마다 흰 말, 붉은 말, 검은 말, 청황색 말을 탄 자들이 나타나 전쟁과 기근, 죽음의 심판이 땅에 임하는 것을 요한이 보았다.", "themes": ["하나님의 심판", "종말과 소망"], "audience": ["성인"], "style": "v2"}, {"no": 361, "title": "십사만 사천을 인침", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 7:1-17", "summary": "땅과 바다를 해하는 것이 잠시 보류된 가운데 이스라엘 각 지파에서 인침받은 십사만 사천과, 각 나라와 족속과 백성과 방언에서 나온 셀 수 없는 큰 무리가 흰 옷을 입고 하나님 보좌 앞에서 찬양했다.", "themes": ["인도하심과 보호", "종말과 소망"], "audience": ["청소년", "성인"], "style": "v2"}, {"no": 362, "title": "일곱째 인과 일곱 나팔", "testament": "신약", "book": "요한계시록", "book_order": 66, "ref": "계 8:1-9:21", "summary": "일곱째 const st = { q: P.get('q') || '', t: P.get('t') || '', book: P.get('book') || '', theme: '', aud: new Set(), sort: 'no' };
const $ = s => document.querySelector(s);
const books = [...new Map(DATA.map(d => [d.book, d.book_order])).entries()].sort((a, b) => a[1] - b[1]);
books.forEach(([b]) => $('#book').insertAdjacentHTML('beforeend', `<option>${b}</option>`));
[...new Set(DATA.flatMap(d => d.themes))].sort().forEach(t => $('#theme').insertAdjacentHTML('beforeend', `<option>${t}</option>`));
$('#q').value = st.q; $('#book').value = st.book;
document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === st.t));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(3, '0');
function match(d) {
  if (st.t && d.testament !== st.t) return false;
  if (st.book && d.book !== st.book) return false;
  if (st.theme && !d.themes.includes(st.theme)) return false;
  for (const a of st.aud) if (!d.audience.includes(a)) return false;
  const q = st.q.trim().replace(/\s+/g, '');
  if (!q) return true;
  if (/^\d+$/.test(q)) return String(d.no) === String(+q) || pad(d.no).includes(q);
  return (d.title + d.book + d.ref + d.summary + d.themes.join('')).replace(/\s+/g, '').includes(q);
}
function card(d) {
  const e = P.get('embed') === '1' ? '&embed=1' : '';
  return `<a class="card" href="view?n=${d.no}${e}">
    <div class="meta"><span class="no">#${pad(d.no)}</span><span class="tag ${d.testament === '구약' ? 'ot' : 'nt'}">${d.testament}</span><span>${esc(d.book)} · ${esc(d.ref)}</span></div>
    <h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p></a>`;
}
function render() {
  let list = DATA.filter(match);
  if (st.sort === 'bible') list.sort((a, b) => a.book_order - b.book_order || a.no - b.no); else list.sort((a, b) => a.no - b.no);
  let html = '', last = '';
  for (const d of list) {
    if (st.sort === 'bible' && d.book !== last) { last = d.book; html += `<div class="group">${esc(d.book)}<small>${list.filter(x => x.book === d.book).length}편</small></div>`; }
    html += card(d);
  }
  $('#grid').innerHTML = html || '<div class="empty">조건에 맞는 이야기가 없습니다.</div>';
  $('#count').textContent = `${list.length} / ${DATA.length}편`;
}
$('#q').addEventListener('input', e => { st.q = e.target.value; render(); });
$('#book').addEventListener('change', e => { st.book = e.target.value; render(); });
$('#theme').addEventListener('change', e => { st.theme = e.target.value; render(); });
$('#sort').addEventListener('change', e => { st.sort = e.target.value; render(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  st.t = b.dataset.t; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
}));
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on);
  on ? st.aud.add(b.dataset.a) : st.aud.delete(b.dataset.a); render();
}));
render();
</script>
</body>
</html>
